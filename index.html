<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetherOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./g.css">
</head>
<body>
    <div class="time-screen" id="time-screen">
        <div class="info">
            <a href="https://wallpapercave.com/w/wp8368519" target="_blank" id="cprght">About that image...</a>
        </div>
        <div class="date">
            <h1 id="hms"></h1>
            <h2 id="date"></h2>
        </div>
        <p>Swipe up to unlock</p>
    </div>

    <div class="login-screen" id="login-page">
        <div class="bg"></div>
        <div class="fg">
            <div class="pfinfo">
                <img src="./imgs/_USR_PFP/pfp.jpg">
                <h2>Vova-Professor</h2>
            </div>

            <div class="pin-wrapper">
                <input type="text" class="pin" id="pin" placeholder="PIN" maxlength="4">
            </div>
            <p id="err-txt"></p>
            <p onclick="forg();">Forget pin?</p>
            
        </div>

    </div>


    <script src="./scripts/time.js"></script>
    <script src="./scripts/unlock.js"></script>
    <script src="./scripts/background.js"></script>
    <script src="./scripts/login.js"></script>
</body>
</html>
