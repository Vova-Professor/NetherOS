<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../../../g.css">
</head>
<body>
    <div class="fsettings">
        <h2>Personalization</h2>

        <article>
            <h3>Preview</h3>
            <div class="preview-screen">
                <section class="taskbar-group">
                    <nav class="taskbar">
                        <div class="app"></div>
                        <div class="app"></div>
                        <div class="app"></div>
                    </nav>

                    <div class="time-wrap">
                        <nav class="clock">
                            <div class="time" id="hms">00:00</div>
                        </nav>

                        <nav class="calendar">
                            <div class="date" id="date">1 April, 2029</div>
                        </nav>
                    </div>
                    
                </section>
            </div>
        </article>

        <article>
            <h3>Backgrounds</h3>
            <div class="bgs">
                <div class="bg-container">
                    <img src="../../../../../imgs/_BGS/_WP_SNST.jpeg" alt="" class="selected">
                    <h3>Ocean Sunset</h3>
                    <span>by <a href="https://github.com/Vova-Professor/NetherOS">Vova-Professor</a></span>
                </div>

                <div class="bg-container">
                    <img src="../../../../../imgs/_BGS/_WP_SKRA.jpg" alt="">
                    <h3>Sakura Field</h3>
                    <span>by <a href="https://moewalls.com/games/sakura-field-minecraft-live-wallpaper/">XiaoHe_3u3</a></span>
                </div>

                <div class="bg-container">
                    <img src="../../../../../imgs/_BGS/_WP_ISLND.jpg" alt="">
                    <h3>Crater Lake</h3>
                    <span>by <a href="https://www.pinterest.com/pin/412783122071230767/">Unknown</a></span>
                </div>

                <div class="bg-container" id="custom-bg-container">
                    <div class="custom-bg-img" id="custom-bg-preview">
                        <img src="../../imgs/phantom.png" alt="" id="custom-placeholder">
                    </div>
                    <input type="file" id="custom-bg-input" accept="image/*" style="display:none;">

                    <h3>Custom</h3>
                </div>
            </div>

        </article>

        <article>
            <h3>Appearance</h3>
            <div class="colors-wrap">
                <div class="color selected" data-stylecolor="dark-black" style="background-color: black;"></div>
                <div class="color" data-stylecolor="light-white" style="background-color: rgb(255, 255, 255);"></div>
                <div class="color" data-stylecolor="peaceful-green" style="background-color: rgb(0, 255, 34);"></div>
                <div class="color" data-stylecolor="normal-tomato" style="background-color: rgb(255, 41, 41);"></div>
                <div class="color" data-stylecolor="light-pink" style="background-color: rgb(255, 55, 195);"></div>
            
            </div>
            

        </article>
    </div>

    <script src="script.js"></script>

</body>
</html>
