<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftCode</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../g.css">
</head>
<body>
    <header>
        <div class="file-wrap">
            <img src="" id="lang-icon" style="opacity:0;">
            <input type="text" class="file-name" placeholder="File name...">
        </div>
        
        <div class="btns-wrap">
            <button class="save-btn" title="Save code..." style="display: none;"></button>
            <button class="run-btn" title="Run code..."></button>
        </div>

    </header>
    <div class="edit-wrap">
        <div class="line-numbers"></div>
        <div class="editor-wrapper">
            <div class="highlight-layer"></div>
            <textarea class="code" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <iframe id="preview" frameborder="0" style="display: none;"></iframe>
    </div>

    <section class="console">
        <h2>Local Console For Craft Code</h2>
        <textarea id="stdin" placeholder="Type here..." spellcheck="false"></textarea>
        <h3 id="output"></h3>
    </section>
    <script src="main.js"></script>
    <script src="editor.js"></script>
    
</body>
</html>
