<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>App Injector</h1>
        <h2>Add your custom app!</h2>
    </header>

    <main>
        <article>
            <div class="icon">
                    <img src="../settings/imgs/phantom.png" alt="">
            </div>
            <div class="info-group">
                <div class="upper-group">
                    <div class="field-group">
                        <label for="">Title</label>
                        <input type="text" class="text-input" id="appTitle" placeholder="Tic tac toe">
                    </div>

                    <div class="field-group">
                        <label for="">Image URL</label>
                        <input type="url" class="text-input" id="imgURL" placeholder="https://">
                    </div>

                </div>
                <div class="field-group">
                    <label for="app-link">Link to your app</label>
                    <input type="url" name="app-link" id="appURL" class="text-input" placeholder="https://">
                </div>

            </div>
        </article>



        <input type="button" value="Create" class="create-btn">
    </main>

    <script src="./script.js"></script>



</body>
</html>
